const tangentOf = (F, angle) => {

const angleToward = (F, direction) => Math.atan2(dot3(direction, F.v), dot3(direction, F.u));

function hullTagged(points) {

const hullOf = (points) => hullTagged(points.map((p) => ({ p }))).map(({ p }) => p);

function runsOf(flags) {

  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;

function groupsOf(keys) {

    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;

  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);

  if (current) out.push(current);

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);

  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);

}

function curveRuns(meridian) {
  const m = meridian.length;

    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {

    const [s1] = meridian[i + 1];

          out.push([mid, curve.radius(mid), 1]);

      split(s0, s1, 0);

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {

function sideOf(meridian) {
  const m = meridian.length;

  let last = m - 1;

  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;

}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {

  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);

  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {

    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)
      for (let turn = -2; turn <= 2; turn++) {
        const lo = Math.max(a + turn * TAU, from);
        const hi = Math.min(b + turn * TAU, to);
        if (hi - lo > 1e-6) pieces.push([lo, hi, lo > from + 1e-9, hi < to - 1e-9]);
      }
    for (const [lo, hi, limb0, limb1] of pieces) {
      const span = hi - lo;
      const cut0 = limb0 && trim > 0 ? Math.min(span * 0.25, trim / (speed(lo) || 1)) : 0;

const LAST = STEPS.length;                    // v5: 6 steps (v4's step 4 「放開囊胚」 is gone)

const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const ease = (v) => { const x = clamp(v); return x * x * (3 - 2 * x); };
const span = (s, a, b) => ease((s - a) / (b - a));
const mix = (a, b, k) => a + (b - a) * k;
const mix3 = (a, b, k) => [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];
// soft tissue recoil: critically damped (1 + u/τ)·e^(−u/τ), u in seconds — soft start, no overshoot
const cdamp = (u, tau) => (u <= 0 ? 1 : (1 + u / tau) * Math.exp(-u / tau));

// ---------- the sample tube (PCR tube, not to scale: scaled so the 20 µm pipette can sit over its mouth) ----------
const TUBE = { at: [218, -110, 6], k: 7 };      // judgment: 7 µm per mm → 138 µm tall, ⌀ 42 µm; v3: the mouth bore (⌀ 36) must take the ⌀ 32 pipette tip
// v3 (judgment): the tube stands 62 µm nearer the viewer than in v2 (205, −172): lower in the picture, so the open lid stays clear of the
// 「PGT-A」 corner label; still on the far right corner of the plate, off the dish (dish wall 207, tube + stand ring 27 → 244 from the centre),
// its stand foot 5 µm short of the sensor plug
const TUBE_TOP = TUBE.at[2] + Pc.TUBE.H * TUBE.k;
// ---------- step 6: the biopsy pipette stands up over the tube, dips its tip into the mouth and lets the string slide out ----------
const PHI_END = (96 * Math.PI) / 180;           // judgment: "nearly vertical": the pipette axis ends 6° off the vertical, tip down; v3: its top leans back toward −x
                                                       // (v2: 4° toward +x) so the shank leaves the frame left of the 「PGT-A」 label on phones; ≤ 8° keeps the ⌀ 32 tip clear of the ⌀ 36 bore at 8 µm deep
const DEPTH_IN = 8;                                    // judgment: the tip goes 8 µm below the rim (bore ⌀ 36 vs pipette ⌀ 32: 2 µm clear all round)
const Z_HOVER = Math.round(TUBE_TOP + 16);      // judgment: tip height while the standing pipette travels over (16 µm above the rim; clears the stand)
const T_IN = [TUBE.at[0], TUBE.at[1], TUBE_TOP - DEPTH_IN];   // tip (mouth centre) when it is in the tube
const U_OPEN = Pc.U_OPEN;                       // lid opened to 110°
// the pipette frame for tilt φ (axis from the mouth into the pipette) and cut-plane roll ρ: e = axis, u1 = lateral (angle 0), u2 = normal of the drawn cut plane
function pipFrame(phi, roll) {
  const e = [Math.cos(phi), 0, Math.sin(phi)], n0 = [-Math.sin(phi), 0, Math.cos(phi)];
  const cr = Math.cos(roll), sr = Math.sin(roll);
  return { e, u1: [-sr * n0[0], cr, -sr * n0[2]], u2: [cr * n0[0], sr, cr * n0[2]] };   // roll about the axis: u1 = cos ρ·y − sin ρ·n0, u2 = cos ρ·n0 + sin ρ·y
}
const FR_DEP = { T: T_IN, ...pipFrame(PHI_END, Math.PI / 2) };   // the frame of the tilted pipette while it deposits (fixed)
// cells resting at the bottom of the tube cone: [sideways, height above TUBE.at z], in the order they land (mouth cell first, front cell last)
const PILE = [7, 13.5, 20, 26.5, 33, 39.5];          // judgment: heights of the six cell centres above TUBE.at z: a small sticky cluster, 6.5 µm apart; the zig-zag is whatever the cone leaves
const R_TUBE = 5.6;                             // judgment: a cell is round (⌀ 11.2) in the tube cone (the cone is ⌀ 12 at the bottom)
// timeline of step 6 (fractions of the step; judgment): lid opens, pipette lifts and stands up, goes over the tube, dips in,
// the string slides out, the pipette rises, goes back and lies down, the lid closes
const T7 = { open: [0.02, 0.12], tilt: [0.06, 0.28], go: [0.26, 0.44], dive: [0.44, 0.52], dep: [0.54, 0.8], rise: [0.82, 0.88], back: [0.86, 0.95], close: [0.9, 0.99] };

// ---------- steps 1–6 ----------
const HOLD_PARK = [-40, 0, 38];                      // holder parked up and to the left in step 1
const BIOP_PARK = [165, 0, ZC + 38];                 // biopsy pipette parked up and to the right in step 1
const WORK = [150, 0, ZC];                           // biopsy tip waiting on the axis after the turn
const contact = (th) => [B.R * Math.cos(th), B.R * Math.sin(th) + K.PIP.rOut + 0.5, ZC];   // tip corner on the zona
const TH0 = (8 * Math.PI) / 180;                     // the nudge starts just below 3 o'clock
// ---------- step 4 剪力切片 (v5, physician) ----------
// The holding pipette keeps the blastocyst (from step 2 to the end it never lets go or moves). The biopsy pipette stays where step 3
// left it (no pull-back, nothing along its axis) and makes one short stroke in the dish plane, across its own axis: out toward
// 12 o'clock (−y, up in the microscope) and back. The mochi thread between the opening cell (half in the opening) and the mouth cell
// (half in the mouth) is drawn out sideways, thins and parts at its middle by itself (nothing touches it); both ends retract into
// rounded caps. The opening cell stays on the blastocyst, the mouth cell in the pipette. The collapse starts at the break.
const STROKE = 10;                                    // judgment: the stroke, µm across the axis (toward 12 o'clock), then back
const T4 = { out: [0.05, 0.27], back: [0.32, 0.56], thin: 0.07 };   // judgment: shares of step 4 (stroke out, stroke back, thinning starts)
const S_BREAK = 0.25;                                 // judgment: the thread parts near the end of the out stroke
const T6 = [165, 50, ZC];                             // biopsy tip after it leaves the blastocyst (step 5)
const A_MIN = 3;                                      // judgment: bulge when the figure opens (the cells have just started to herniate)
const A_FUN = 11;                                     // judgment: bulge height after the aspiration (apex 91.5; the opening cell sits at 88)
const A_END = 5, F_END = 0.4;                         // after recovery: opening region bulges out ~5 µm (physician); F_END = 0.4 (a little funnel left) is a judgment
const T_RE = 0.12;                                    // judgment (v5): step 5, re-expansion starts once the biopsy pipette has moved off (no re-hold any more)
const TAU6 = 0.9;                                     // step 5: re-expansion, critically damped τ (physician)
const strokeY = (s) => -STROKE * (span(s, ...T4.out) - span(s, ...T4.back));

function pose(t) {
  t = clamp(t, 0, LAST);
  const step = Math.max(1, Math.ceil(t));
  const s = t - (step - 1);
  const p = {
    step, s, C: [0, 0, 0], rot: 0, hold: [...HOLD_PARK], suction: 0, T: [...BIOP_PARK],
    st: { A: A_MIN, f: 0, u: 0, fl: 0 },              // state of the cell layer (blast.mjs)
    asp: 0, thread: null, brk: -1, joined: true, lid: 0, phi: 0, roll: 0, dep: -1,
  };
  if (step === 1) {
    // resting in the drop: the herniated cells bulge out through the opening
    p.st.A = mix(A_MIN, B.A_DOME, span(s, 0.08, 0.85));
    return p;
  }
  p.st = { A: B.A_DOME, f: 0, u: 0, fl: 0 };
  if (step === 2) {
    // the holder glides in until its mouth touches the zona; the biopsy pipette nudges the zona just below 3 o'clock and
    // rolls the blastocyst 30° clockwise (its tip leads the turn), backs off to the axis, and only then the holder sucks
    p.hold = mix3(HOLD_PARK, [0, 0, 0], span(s, 0.02, 0.3));
    const th = TH0 + TURN * span(s, 0.32, 0.71);
    p.rot = TURN * span(s, 0.33, 0.72);
    let T = mix3(BIOP_PARK, contact(TH0), span(s, 0.06, 0.3));
    if (s > 0.31) T = contact(th);
    const away = contact(TH0 + TURN);
    T = mix3(T, [WORK[0], away[1], ZC], span(s, 0.73, 0.82));
    T = mix3(T, WORK, span(s, 0.8, 0.9));
    p.T = T;
    p.suction = span(s, 0.84, 0.97);
    return p;
  }
  // from here on the holder holds the blastocyst where step 2 left it (v5: it never lets go or moves)
  p.rot = TURN;
  p.hold = [0, 0, 0];
  p.suction = 1;
  if (step === 3) {
    // v3: the pipette goes straight to its aspiration position (v6: mouth 110 µm from the centre, 4 µm short of the dome apex) and
    // stays there; the cells are then drawn out of the dome as ONE connected sticky string (see chainOf), the dome sinks
    p.T = mix3(WORK, BIOP_AT, span(s, 0.04, 0.3));
    const a = span(s, 0.3, 0.94);                      // judgment: the string needs ~64 % of the step
    p.asp = a;
    // v7: the six dome cells leave one by one as one sticky chain (asp.mjs); the layer follows the section's map (st.g), its mound
    // round the opening cell rises as the opening cell rises (judgment: to v6's 11 µm)
    const ph = Asp.phaseOf(t);
    p.ph = ph;
    p.st = { A: A_FUN * ph.qO, f: 0, u: 0, fl: 0, g: Asp.geomOf(ph.u, ph.qO, 0) };
    return p;
  }
  p.asp = 1;
  p.ph = Asp.phaseOf(t);
  const G_END = Asp.geomOf(Asp.U_MAX, 1, p.ph.qR);              // v7: the opening closed by its neighbours (the dome cells are gone)
  p.st = { A: A_FUN, f: 1, u: 0, fl: 0, g: G_END };
  if (step === 4) {
    // v5: the stroke out and back; the thread thins from the start of the stroke to the break, then both ends retract
    p.T = [BIOP_X, strokeY(s), ZC];
    p.thread = { tf: 1, kk: 1 - Math.pow(clamp((s - T4.thin) / (S_BREAK - T4.thin)), 1.6), ret: 0 };   // judgment: exponent 1.6
    p.thread.ret = 0.25 * (1 - ease(p.thread.kk / 0.3));       // liquid-bridge contraction just before the break (judgment: 25 % of the flank length, from kk < 0.3)
    if (s > S_BREAK) {
      p.joined = false;
      p.brk = (s - S_BREAK) * SEC * DUR[3];
      p.thread = { tf: 1, kk: 0, ret: 1 - 0.75 * cdamp(p.brk, 0.12) };   // judgment: τ = 0.12 s
      // v3: the layer starts its eccentric collapse the moment the thread parts and is at its maximum when the step ends
      const uc = span(s, S_BREAK, 1);
      p.st = { A: (1 - uc) * A_FUN, f: 1, u: uc, fl: 0, g: G_END };
    }
    return p;
  }
  p.joined = false;
  p.brk = 99;
  if (step === 5) {
    // the biopsy pipette moves off; the holder keeps the blastocyst. The zona does not move. The cell layer re-expands from its
    // maximum collapse, critically damped (τ = 0.9 s), flush against the zona inner wall with the opening region bulging out ~5 µm
    p.T = mix3(BIOP_AT, T6, span(s, 0, 0.18));
    const cd = s <= T_RE ? 1 : cdamp((s - T_RE) * SEC * DUR[4], TAU6);
    const fin = span(s, 0.92, 1);
    const u = cd * (1 - fin);
    const q = Math.max(s <= T_RE ? 0 : 1 - cd, fin);
    p.st = { A: (1 - u) * mix(A_FUN, A_END, q), f: mix(1, F_END, q), u, fl: q, g: G_END };
    return p;
  }
  // step 6 (v3, was step 7): the lid opens to 110°; the pipette lifts, stands up (tip down, 86°) and goes over the tube, dips its tip
  // into the mouth, the string slides out and settles at the bottom of the cone; the pipette rises, goes back and lies down; the lid closes
  p.st = { A: A_END, f: F_END, u: 0, fl: 1, g: G_END };
  const lift = span(s, ...T7.tilt), go = span(s, ...T7.go), dive = span(s, ...T7.dive), rise = span(s, ...T7.rise), back = span(s, ...T7.back);
  let z = mix(ZC, Z_HOVER, lift);
  z = mix(mix(mix(z, T_IN[2], dive), Z_HOVER, rise), ZC, back);
  const x = mix(mix(T6[0], T_IN[0], go), T6[0], back), y = mix(mix(T6[1], T_IN[1], go), T6[1], back);
  p.T = [x, y, z];
  p.phi = PHI_END * lift * (1 - back);
  p.roll = (Math.PI / 2) * (p.phi / PHI_END);
  p.lid = U_OPEN * (span(s, ...T7.open) - span(s, ...T7.close));
  p.dep = s >= T7.dive[1] ? V_TOT * span(s, ...T7.dep) : -1;   // distance the string has been pushed out (µm); −1 = still in the bore of the moving pipette
  return p;
}

// ---------- the opening cell, the six pipette cells and the thread (pipette frame: mouth at x = 0) ----------
const sst = (a, b, x) => { const v = clamp((x - a) / (b - a)); return v * v * (3 - 2 * v); };
// v3 string: the six pipette cells leave the herniated dome together, one connected sticky string (toothpaste): the front cell
// leads, the others follow with a delay, every neighbour pair stays joined by a mochi neck (cells.mjs). Index = SLOTS index.
// judgment: progress window of each cell as a share of the aspiration (front first, mouth cell last; windows overlap so the string never parts)
const ARR = [[0.44, 0.90], [0.30, 0.78], [0.34, 0.82], [0.2, 0.7], [0.23, 0.74], [0.1, 0.62]];
// where each cell sits in the dome before the string is drawn out (pipette frame: x from the mouth, y sideways): one compact mass
const START = [[-33.5, 0], [-30, -5.5], [-30, 5.5], [-26.5, -5], [-26.5, 5], [-22.5, 0]];   // judgment
const START_C = [-28, 0];
const STICKY_R = 2.2;                                // smooth-union radius of the string (judgment; the v2 end state used 0.9)
const R_OUT = 6.2;                                  // a cell is round (⌀ 12.4) outside the pipette
// ---------- step 6: the string slides out of the standing pipette, down into the cone, and settles ----------
// Piston flow: every cell moves along the pipette axis by the same distance V (the string is pushed out like toothpaste: the mouth
// cell leaves first, the front cell last) until it reaches its place in the pile. Inside the cone a cell can only sit as far from
// the axis as the wall allows, so the pairs close up into single file. Frame: the tilted pipette's (FR_DEP once the tip is in the tube).
const coneR = (zw) => {                              // inner radius of the tube at world height zw (µm), the cone below the mouth
  const sMm = Math.max(0, (zw - TUBE.at[2]) / TUBE.k);
  return Math.max(0, Pc.rOut(Math.min(sMm, Pc.TUBE.sLip - 0.01)) - Pc.TUBE.wall) * TUBE.k;
};
const landX = K.SLOTS.map((_, j) => (TUBE.at[2] + PILE[j] - T_IN[2]) * FR_DEP.e[2]);   // axis coordinate of the resting place (mouth at 0, downward negative)
const V_TOT = Math.max(...K.SLOTS.map((sl, j) => sl.x - landX[j])) + 0.5;
function chainLast(p) {
  const deposit = p.dep >= 0;
  const fr = deposit ? FR_DEP : { T: p.T, ...pipFrame(p.phi, p.roll) };
  const S = { cells: [], thread: null, step: LAST, r: mix(0.9, STICKY_R, sst(0, 12, p.dep)), falls: [], joined: false, openWorld: true,
    frame: { T: fr.T, e: fr.e, u1: fr.u1, bend: deposit } };   // v3: bend = below the mouth the string follows the tube's vertical axis (live.js mapOf)
  for (let j = 0; j < 6; j++) {
    const sl = K.SLOTS[j];
    const x = deposit ? Math.max(sl.x - p.dep, landX[j]) : sl.x;
    const zw = fr.T[2] + x * fr.e[2];
    const lim = Math.max(0, coneR(zw) - R_TUBE - 0.4);
    const out = sst(5, -5, x);                          // 0 inside the bore, 1 below the mouth
    const y = mix(sl.y, Math.sign(sl.y) * Math.min(Math.abs(sl.y), lim), out);
    const rr = mix(R_OUT, R_TUBE, sst(0, -30, x));      // the cell eases to its tube size as it goes down the cone
    const inside = sst(-6, 5, x);
    S.cells.push({ x, y, rx: mix(rr, sl.rx, inside), ry: mix(rr, sl.ry, inside) });
  }
  // the opening cell stays on the blastocyst (world frame)
  const rotA = B.OPEN_AT + p.rot, e = [Math.cos(rotA), Math.sin(rotA)];
  const rc = B.apexR(p.st) - 3.5;
  S.cells.unshift({ x: p.C[0] + e[0] * rc, y: p.C[1] + e[1] * rc, rx: K.CELL1.rx, ry: K.CELL1.ry });
  S.zOpen = ZC + p.C[2];
  return S;
}

function chainOf(p) {
  if (p.step === LAST) return chainLast(p);

  const rotA = B.OPEN_AT + p.rot, e = [Math.cos(rotA), Math.sin(rotA)], n = [-e[1], e[0]];
  const a = p.asp;
  const Tw = p.T;
  const zOpen = ZC + p.C[2];

    lineSvg(shellLine, { tone: "hi", className: "pg-gline" }),
    `<path class="pg-gface" d="${face(Math.PI)}${face(0)}${rimFace}"/>`,
    lineSvg(pathOf(lipI, false), { tone: "faint", className: "pg-thin" }),
    lineSvg(pathOf(curve(K.innerR, Math.PI)) + pathOf(curve(K.innerR, 0)) + pathOf(curve(K.outerR, 0)) + (fb ? fb.lines[1] : pathOf(curve(K.outerR, Math.PI))) + pathOf(rimO, false) + pathOf(rimI, false) + pathOf(lipO, false), { tone: "hi", className: "pg-gline" }),

}
let biopKey = "";
function drawBiop(p) {
  const phi = r4(p.phi), roll = r4(p.roll), key = phi + "|" + roll;   // drawn from the rounded key (see drawBlast)
  if (key === biopKey) return;
  biopKey = key;
  gBiop.innerHTML = pipetteSvg(M.pipFrame(phi, roll));
}

// ======================================================================================================
// the sample tube's lid (PCR tube, hinged flat strap): strap, tab and plug for the lid parameter u (0 closed … 1 open)
// ======================================================================================================
const LD = Pc.LID, LK = M.TUBE.k, TAt = M.TUBE.at;
const Wl = (q) => [TAt[0] + LK * q[0], TAt[1] + LK * q[1], TAt[2] + LK * q[2]];
const area2 = (pts) => { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
const ccw2 = (pts) => (area2(pts) < 0 ? [...pts].reverse() : pts);
function strapSvg(L0) {
  const line = L0.line.filter((_, i) => i % 2 === 0).map(Wl), nm = L0.normals.filter((_, i) => i % 2 === 0);
  const n = line.length, hs = (LD.ts * LK) / 2, hw = (LD.ws * LK) / 2, Wd = Pc.Wd;
  const O = (i, sg) => addv(addv(line[i], mulv(nm[i], hs)), mulv(Wd, sg * hw));
  const I = (i, sg) => addv(addv(line[i], mulv(nm[i], -hs)), mulv(Wd, sg * hw));
  const faces = [];
  const quad = (pts3, normal) => faces.push([ccw2(pts3.map((q) => iso(q, P))), pts3.reduce((d, q) => d + depthOf(q, P), 0) / 4, G.toneOf(normal, P)]);
  const visOut = [], visIn = [];
  for (let i = 0; i < n - 1; i++) {
    const nmm = nm[i].map((v, j) => (v + nm[i + 1][j]) / 2);
    visOut.push(dot(nmm, V) > 1e-6); visIn.push(dot(nmm, V) < -1e-6);
    if (visOut[i]) quad([O(i, -1), O(i + 1, -1), O(i + 1, 1), O(i, 1)], nmm);
    if (visIn[i]) quad([I(i, -1), I(i + 1, -1), I(i + 1, 1), I(i, 1)], mulv(nmm, -1));
    quad([O(i, 1), O(i + 1, 1), I(i + 1, 1), I(i, 1)], Wd);
  }
  faces.sort((a, b) => a[1] - b[1]);
  const fillD = faces.map(([q]) => polyS(q, true)).join("");
  const byTone = [[], [], [], [], []];
  for (const [q, , t] of faces) byTone[t].push(polyS(q, true));
  const sc = (q) => iso(q, P);
  const edges = [polyS(line.map((_, i) => sc(O(i, 1))), false), polyS(line.map((_, i) => sc(I(i, 1))), false)];
  for (const [vis, F] of [[visOut, O], [visIn, I]]) {
    let run = null;
    for (let i = 0; i <= vis.length; i++) {
      if (i < vis.length && vis[i]) { if (!run) run = [i]; run.push(i + 1); }
      else if (run) {
        const ids = [...new Set(run)];
        edges.push(polyS(ids.map((j) => sc(F(j, -1))), false));
        for (const j of [ids[0], ids[ids.length - 1]]) edges.push(polyS([sc(F(j, 1)), sc(F(j, -1))], false));
        run = null;
      }
    }
  }
  edges.push(polyS([sc(O(0, 1)), sc(I(0, 1))], false));
  const shades = byTone.slice(0, 4).map((list, t) => (list.length ? `<path class="iso-shade" data-shade="${t}" d="${list.join("")}"/>` : "")).join("");
  return `<g class="iso-solid pg-tube pg-strap"><path class="iso-fill" d="${fillD}"/>${shades}${byTone[4].length ? `<path class="iso-top" d="${byTone[4].join("")}"/>` : ""}<path class="iso-line iso-edge" data-tone="hi" d="${edges.join("")}"/></g>`;
}
function tabPlugSvg(L0) {
  const o = Wl(L0.o), e = L0.e, nrm = L0.n, Wd = Pc.Wd;
  const FTab = G.frameOf(o, nrm, e, Wd);
  const plan = roundedPlan({ x: 0, y: (-LD.wt * LK) / 2, w: LD.Lt * LK, d: LD.wt * LK, r: LD.rt * LK }, 8);
  const outerSeen = dot(nrm, V) < -1e-3;
  const recessC = addv(addv(o, mulv(e, LD.Dp * LK)), mulv(nrm, (-LD.Tt * LK) / 2));
  const recess = outerSeen ? lineSvg(polyS(Array.from({ length: 36 }, (_, i) => { const t = (i / 36) * 2 * Math.PI; return iso(addv(recessC, addv(mulv(e, LD.rRecess * LK * Math.cos(t)), mulv(Wd, LD.rRecess * LK * Math.sin(t)))), P); }), true), { tone: "mid" }) : "";
  const tab = solidSvg(G.prismOf(FTab, plan, (-LD.Tt * LK) / 2, (LD.Tt * LK) / 2, P), { tone: "hi", className: "pg-tube", inner: recess });
  const FP = G.frameOf(Wl(L0.plugBase), nrm, e, Wd);
  const plugEnd = dot(nrm, V) > 1e-3 ? lineSvg(G.arcOf(FP, LD.hp * LK, (LD.rpTip - LD.cham - 0.35) * LK, P, { least: -1 }), { tone: "faint" }) : "";
  const prof = Pc.plugProfile().map(([s, r]) => [s * LK, r * LK]);
  const plug = solidSvg(G.solidOf(prof, FP, P), { tone: dot(nrm, V) > 0 ? "hi" : "mid", className: "pg-tube", inner: plugEnd });
  return dot(nrm, V) > 0 ? tab + plug : plug + tab;
}
let lidKey = -1;
function drawLid(u) {
  const k = Math.round(u * 400);
  if (k === lidKey) return;
  lidKey = k;
  const L0 = Pc.lid(k / 400);
  gLid.innerHTML = strapSvg(L0) + tabPlugSvg(L0);
}

let t = N, target = N, playing = false, touring = !still.matches, clock = 0, last = 0, frame = 0, visible = false, idle = 0, pauseLeft = 0, lastStep = 0;
const SPEED = 1 / 3.4; // steps per second
function draw() {
  ljsReady();
  const p = M.pose(t);
  gHold.setAttribute("transform", translateAlong(P, p.hold));
  gBiop.setAttribute("transform", translateAlong(P, [p.T[0] - M.BIOP_AT[0], p.T[1] - M.BIOP_AT[1], p.T[2] - M.BIOP_AT[2]]));
  gShell.setAttribute("transform", translateAlong(P, p.C));
  drawBlast(p);
  drawBiop(p);
  drawCells(p);
  clipTip(p);
  drawLid(p.lid);
  drawFine();
  const st = M.STEPS[p.step - 1];
  const r = M.readout(p);
  if (readoutEl.textContent !== r) readoutEl.textContent = r;
  if (p.step !== lastStep) {
    lastStep = p.step;
    nowName.textContent = `步驟 ${p.step}/${N} ${st.name}`;
    nowText.textContent = st.text;
    buttons.forEach((b, i) => { b.setAttribute("aria-selected", String(i + 1 === p.step)); });
    stage.setAttribute("aria-valuetext", `步驟 ${p.step}：${st.name}`);
  }
  playBtn.textContent = playing || touring ? "❚❚" : "▶";
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring || playing) {
    if (pauseLeft > 0) pauseLeft -= dt;
    else {
      if (t >= N) { if (touring) { t = 0; target = 0; } else playing = false; }
      const next = Math.min(N, Math.floor(t + 1e-6) + 1);
      t = Math.min(next, t + dt * SPEED / M.DUR[next - 1]);
      target = t;
      if (t >= next - 1e-6) { t = next; pauseLeft = touring ? 1.4 : 0.8; }
    }
  } else if (t !== target) {
    if (calm) t = target;
    else { const d = target - t; const stepv = Math.sign(d) * Math.max(Math.abs(d) * (1 - Math.exp(-dt / 0.35)), (dt * SPEED * (d > 0 ? 1 : 2.5)) / M.DUR[Math.max(0, Math.ceil(t + 1e-6) - 1)] ); t = Math.abs(stepv) >= Math.abs(d) ? target : t + stepv; }
  }
  draw();
  const moving = touring || playing || t !== target;
  const beating = false;
  frame = visible && (moving || beating) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const hold = () => { touring = false; clearTimeout(idle); idle = setTimeout(() => { if (!playing && !still.matches) { touring = true; pauseLeft = 0; run(); } }, 9000); };
const goStep = (n) => {
  hold(); playing = false;
  n = Math.max(1, Math.min(N, n));
  const cur = Math.max(1, Math.ceil(t - 1e-6));
  if (n === cur && Math.abs(t - n) < 1e-6) t = n - 1;            // tap the current step again → replay it
  else if (n < cur || n > cur + 1) t = n - 1;                     // jump, then play the chosen step
  target = n; draw(); run();
};
buttons.forEach((b) => b.addEventListener("click", () => goStep(+b.dataset.step)));
playBtn.addEventListener("click", () => {
  if (playing || touring) { playing = false; touring = false; target = t = Math.round(t * 1000) / 1000; clearTimeout(idle); draw(); return; }
  if (t >= N) t = 0;
  playing = true; pauseLeft = 0; clearTimeout(idle); run();
});
// back to the very start of step 1 and play through
restartBtn.addEventListener("click", () => {
  touring = false; clearTimeout(idle);
  t = target = 0; playing = true; pauseLeft = 0; last = 0;
  draw(); run();
});
// drag across the figure to scrub the whole procedure
let drag = null;
stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, t0: t, on: false, id: e.pointerId }; });
stage.addEventListener("pointermove", (e) => {
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x;
  if (!drag.on && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - drag.y)) { drag.on = true; stage.setPointerCapture(e.pointerId); hold(); playing = false; }
  if (drag.on) { const w = stage.getBoundingClientRect().width; target = t = Math.max(0, Math.min(N, drag.t0 + (dx / w) * N)); draw(); run(); }
});
const end = (e) => { if (drag && drag.on) { try { stage.releasePointerCapture(e.pointerId); } catch {} target = Math.max(1, Math.round(t)); run(); } drag = null; };
stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
stage.addEventListener("keydown", (e) => {
  const cur = Math.max(1, Math.ceil(t - 1e-6));
  if (e.key === "ArrowRight") goStep(Math.min(N, Math.round(t) + 1));
  else if (e.key === "ArrowLeft") goStep(Math.max(1, cur - 1));
  else if (e.key === "Home") goStep(1);
  else if (e.key === "End") goStep(N);
  else if (e.key === " " || e.key === "Enter") playBtn.click();
  else return;
  e.preventDefault();
});
new IntersectionObserver((en) => { visible = en[en.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener?.("change", () => { if (still.matches) { touring = false; playing = false; t = target = Math.max(1, Math.round(t)); } draw(); });
if (!still.matches) { t = 0; target = 0; pauseLeft = 1.4; }
draw();
{ const m = /t=([\d.]+)/.exec(location.hash); if (m) { const v = parseFloat(m[1]); if (Number.isFinite(v)) { touring = false; playing = false; t = target = Math.max(0, Math.min(6, v)); clock = 0; draw(); } } }

</script></body></html>
